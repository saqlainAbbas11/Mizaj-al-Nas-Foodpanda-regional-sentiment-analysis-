<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="karachiSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0E3A"/>
      <stop offset="25%" stop-color="#2A1B5C"/>
      <stop offset="50%" stop-color="#6E3A82"/>
      <stop offset="75%" stop-color="#C46A3F"/>
      <stop offset="100%" stop-color="#E8944A"/>
    </linearGradient>
    <linearGradient id="karachiSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1B3A"/>
      <stop offset="40%" stop-color="#12234A"/>
      <stop offset="100%" stop-color="#162A52"/>
    </linearGradient>
    <radialGradient id="karachiGlow" cx="0.5" cy="0.72" r="0.35">
      <stop offset="0%" stop-color="#E8A050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8A050" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="karachiReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A050" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8A050" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="karachiDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF6"/>
      <stop offset="100%" stop-color="#EDE3D0"/>
    </linearGradient>
    <pattern id="ajrak" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#3A0E1F"/>
      <g stroke="#E4B04A" stroke-width="2" fill="none">
        <circle cx="45" cy="45" r="28"/><circle cx="45" cy="45" r="16"/><circle cx="45" cy="45" r="6"/>
      </g>
      <g fill="#C23A3A">
        <path d="M45 17 L52 33 L38 33 Z"/><path d="M45 73 L52 57 L38 57 Z"/>
        <path d="M17 45 L33 38 L33 52 Z"/><path d="M73 45 L57 38 L57 52 Z"/>
      </g>
      <g fill="#2C6E8E">
        <circle cx="45" cy="45" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="90" cy="0" r="4"/>
        <circle cx="0" cy="90" r="4"/><circle cx="90" cy="90" r="4"/>
        <circle cx="45" cy="0" r="3"/><circle cx="45" cy="90" r="3"/>
        <circle cx="0" cy="45" r="3"/><circle cx="90" cy="45" r="3"/>
      </g>
      <g stroke="#E4B04A" stroke-width="1" fill="none">
        <line x1="0" y1="0" x2="17" y2="17"/><line x1="90" y1="0" x2="73" y2="17"/>
        <line x1="0" y1="90" x2="17" y2="73"/><line x1="90" y1="90" x2="73" y2="73"/>
      </g>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="270" fill="url(#karachiSky)"/>
  <rect width="1200" height="270" fill="url(#karachiGlow)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="85" cy="28" r="1.2" opacity="0.9"/><circle cx="180" cy="55" r="0.8" opacity="0.6"/>
    <circle cx="310" cy="18" r="1" opacity="0.8"/><circle cx="420" cy="42" r="0.7" opacity="0.5"/>
    <circle cx="530" cy="12" r="1.1" opacity="0.7"/><circle cx="680" cy="35" r="0.9" opacity="0.6"/>
    <circle cx="790" cy="20" r="1.3" opacity="0.8"/><circle cx="920" cy="48" r="0.7" opacity="0.5"/>
    <circle cx="1050" cy="22" r="1" opacity="0.9"/><circle cx="1140" cy="58" r="0.8" opacity="0.6"/>
    <circle cx="150" cy="78" r="0.6" opacity="0.4"/><circle cx="460" cy="72" r="0.7" opacity="0.4"/>
    <circle cx="750" cy="65" r="0.6" opacity="0.3"/><circle cx="1100" cy="75" r="0.5" opacity="0.3"/>
  </g>

  <!-- Crescent moon -->
  <g transform="translate(1060,55)">
    <circle cx="0" cy="0" r="22" fill="#F4E8C8" opacity="0.9"/>
    <circle cx="8" cy="-5" r="18" fill="#2A1B5C"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#F4E8C8" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Wispy clouds -->
  <g fill="white" opacity="0.06">
    <ellipse cx="200" cy="100" rx="120" ry="12"/><ellipse cx="250" cy="95" rx="80" ry="8"/>
    <ellipse cx="800" cy="120" rx="140" ry="14"/><ellipse cx="860" cy="115" rx="90" ry="9"/>
  </g>

  <!-- Distant skyline silhouette (left cluster) -->
  <g fill="#1B1140" opacity="0.7">
    <rect x="20" y="180" width="18" height="90"/><rect x="42" y="160" width="14" height="110"/>
    <rect x="60" y="175" width="22" height="95"/><rect x="86" y="195" width="16" height="75"/>
    <rect x="106" y="170" width="20" height="100"/><rect x="130" y="185" width="24" height="85"/>
    <rect x="158" y="192" width="14" height="78"/><rect x="176" y="165" width="18" height="105"/>
    <rect x="198" y="180" width="20" height="90"/>
  </g>
  <!-- Distant skyline silhouette (right cluster) -->
  <g fill="#1B1140" opacity="0.7">
    <rect x="930" y="175" width="20" height="95"/><rect x="954" y="155" width="16" height="115"/>
    <rect x="974" y="185" width="24" height="85"/><rect x="1002" y="140" width="18" height="130"/>
    <rect x="1024" y="165" width="22" height="105"/><rect x="1050" y="180" width="16" height="90"/>
    <rect x="1070" y="150" width="20" height="120"/><rect x="1094" y="175" width="24" height="95"/>
    <rect x="1122" y="190" width="18" height="80"/><rect x="1144" y="168" width="22" height="102"/>
    <rect x="1170" y="185" width="16" height="85"/>
  </g>
  <!-- Window lights on distant buildings -->
  <g fill="#FFD680" opacity="0.5">
    <rect x="46" y="168" width="3" height="3" rx="0.5"/><rect x="50" y="180" width="3" height="3" rx="0.5"/>
    <rect x="46" y="192" width="3" height="3" rx="0.5"/><rect x="112" y="178" width="3" height="3" rx="0.5"/>
    <rect x="180" y="172" width="3" height="3" rx="0.5"/><rect x="180" y="184" width="3" height="3" rx="0.5"/>
    <rect x="958" y="162" width="3" height="3" rx="0.5"/><rect x="958" y="178" width="3" height="3" rx="0.5"/>
    <rect x="1006" y="148" width="3" height="3" rx="0.5"/><rect x="1010" y="165" width="3" height="3" rx="0.5"/>
    <rect x="1074" y="158" width="3" height="3" rx="0.5"/><rect x="1078" y="174" width="3" height="3" rx="0.5"/>
    <rect x="1148" y="176" width="3" height="3" rx="0.5"/>
  </g>

  <!-- Arabian Sea -->
  <rect y="270" width="1200" height="90" fill="url(#karachiSea)"/>
  <!-- Horizon glow reflection -->
  <rect y="270" width="1200" height="40" fill="url(#karachiReflect)"/>
  <!-- Wave lines -->
  <g stroke="#3E5E9C" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M0 280 Q30 277 60 280 T120 280 T180 280 T240 280 T300 280 T360 280 T420 280 T480 280 T540 280 T600 280 T660 280 T720 280 T780 280 T840 280 T900 280 T960 280 T1020 280 T1080 280 T1140 280 T1200 280"/>
    <path d="M0 295 Q40 291 80 295 T160 295 T240 295 T320 295 T400 295 T480 295 T560 295 T640 295 T720 295 T800 295 T880 295 T960 295 T1040 295 T1120 295 T1200 295"/>
    <path d="M0 310 Q35 307 70 310 T140 310 T210 310 T280 310 T350 310 T420 310 T490 310 T560 310 T630 310 T700 310 T770 310 T840 310 T910 310 T980 310 T1050 310 T1120 310 T1200 310"/>
  </g>

  <!-- Fishing boats -->
  <g fill="#2A1E40">
    <g transform="translate(180,295)">
      <path d="M-20,0 Q-22,-8 0,-12 Q22,-8 20,0 Z"/><line x1="0" y1="-12" x2="0" y2="-30" stroke="#3A2E4A" stroke-width="1.5"/>
      <polygon points="0,-30 14,-22 0,-14" fill="#5A4A6A" opacity="0.6"/>
    </g>
    <g transform="translate(920,288)">
      <path d="M-16,0 Q-18,-7 0,-10 Q18,-7 16,0 Z"/><line x1="0" y1="-10" x2="0" y2="-25" stroke="#3A2E4A" stroke-width="1.5"/>
      <polygon points="0,-25 11,-18 0,-12" fill="#5A4A6A" opacity="0.5"/>
    </g>
    <g transform="translate(1060,300)">
      <path d="M-12,0 Q-14,-5 0,-8 Q14,-5 12,0 Z"/><line x1="0" y1="-8" x2="0" y2="-18" stroke="#3A2E4A" stroke-width="1"/>
    </g>
  </g>
  <!-- Boat light reflections in water -->
  <g stroke="#E8A050" stroke-width="1" opacity="0.15">
    <line x1="180" y1="296" x2="180" y2="330"/><line x1="920" y1="289" x2="920" y2="320"/>
  </g>

  <!-- Mazar-e-Quaid: plinth, arcade, dome -->
  <g transform="translate(600,330)">
    <!-- stairs / plinth -->
    <polygon points="-280,0 280,0 240,-15 -240,-15" fill="#2E2040"/>
    <polygon points="-240,-15 240,-15 220,-30 -220,-30" fill="#3A2A55"/>
    <polygon points="-220,-30 220,-30 200,-42 -200,-42" fill="#463565"/>
    <rect x="-190" y="-72" width="380" height="30" fill="#4A3768"/>
    <rect x="-170" y="-97" width="340" height="25" fill="#5A4478"/>

    <!-- arcade base with shadow -->
    <rect x="-145" y="-195" width="290" height="98" rx="4" fill="#F4EFE6"/>
    <rect x="-145" y="-100" width="290" height="6" fill="#D8CFC0"/>
    <!-- arches -->
    <g fill="#5A4478">
      <rect x="-135" y="-195" width="12" height="95" rx="6"/>
      <rect x="-103" y="-195" width="12" height="95" rx="6"/>
      <rect x="-71"  y="-195" width="12" height="95" rx="6"/>
      <rect x="-39"  y="-195" width="12" height="95" rx="6"/>
      <rect x="-7"   y="-195" width="12" height="95" rx="6"/>
      <rect x="27"   y="-195" width="12" height="95" rx="6"/>
      <rect x="59"   y="-195" width="12" height="95" rx="6"/>
      <rect x="91"   y="-195" width="12" height="95" rx="6"/>
      <rect x="123"  y="-195" width="12" height="95" rx="6"/>
    </g>
    <!-- interior shadow between arches -->
    <g fill="#3A2A50" opacity="0.3">
      <rect x="-123" y="-190" width="20" height="85" rx="2"/>
      <rect x="-91" y="-190" width="20" height="85" rx="2"/>
      <rect x="-59" y="-190" width="20" height="85" rx="2"/>
      <rect x="-27" y="-190" width="20" height="85" rx="2"/>
      <rect x="7" y="-190" width="20" height="85" rx="2"/>
      <rect x="39" y="-190" width="20" height="85" rx="2"/>
      <rect x="71" y="-190" width="20" height="85" rx="2"/>
      <rect x="103" y="-190" width="20" height="85" rx="2"/>
    </g>

    <!-- dome drum -->
    <rect x="-78" y="-242" width="156" height="52" rx="6" fill="#FBF8F1"/>
    <rect x="-78" y="-242" width="156" height="8" rx="4" fill="#EDE3D0"/>
    <!-- great dome -->
    <path d="M-100,-242 A100,100 0 0 1 100,-242 Z" fill="url(#karachiDome)"/>
    <ellipse cx="0" cy="-242" rx="100" ry="20" fill="#EFE7D6"/>
    <!-- dome ribs (subtle) -->
    <g stroke="#D8CFC0" stroke-width="0.8" opacity="0.4">
      <path d="M0,-342 Q-50,-290 -85,-242"/><path d="M0,-342 Q50,-290 85,-242"/>
      <path d="M0,-342 Q-25,-290 -45,-242"/><path d="M0,-342 Q25,-290 45,-242"/>
    </g>
    <!-- finial -->
    <rect x="-3" y="-348" width="6" height="38" fill="#D8B44A"/>
    <circle cx="0" cy="-350" r="8" fill="#E4C05A"/>
    <circle cx="0" cy="-350" r="4" fill="#D8B44A"/>

    <!-- corner cupolas -->
    <g fill="#FBF8F1">
      <path d="M-165,-195 a20,20 0 0 1 40,0 z"/>
      <path d="M125,-195 a20,20 0 0 1 40,0 z"/>
    </g>
    <rect x="-149" y="-195" width="4" height="6" fill="#E4C05A"/>
    <rect x="141" y="-195" width="4" height="6" fill="#E4C05A"/>
  </g>

  <!-- Palm trees (left group) -->
  <g fill="#1B3B2E">
    <g transform="translate(220,332)">
      <rect x="-5" y="-85" width="10" height="85" fill="#2A4A35" rx="3"/>
      <path d="M0,-85 Q-50,-115 -68,-82 Q-30,-92 0,-85Z"/>
      <path d="M0,-85 Q45,-120 65,-90 Q28,-95 0,-85Z"/>
      <path d="M0,-85 Q-15,-125 15,-118 Q8,-95 0,-85Z"/>
      <path d="M0,-85 Q-55,-100 -60,-70 Q-28,-78 0,-85Z"/>
      <path d="M0,-85 Q50,-105 58,-75 Q25,-80 0,-85Z"/>
    </g>
    <g transform="translate(260,338)">
      <rect x="-4" y="-55" width="8" height="55" fill="#2A4A35" rx="2"/>
      <path d="M0,-55 Q-35,-75 -45,-55 Q-18,-62 0,-55Z"/>
      <path d="M0,-55 Q30,-78 42,-58 Q18,-62 0,-55Z"/>
      <path d="M0,-55 Q-10,-80 10,-76 Q5,-62 0,-55Z"/>
    </g>
  </g>
  <!-- Palm trees (right group) -->
  <g fill="#1B3B2E">
    <g transform="translate(940,335)">
      <rect x="-5" y="-72" width="10" height="72" fill="#2A4A35" rx="3"/>
      <path d="M0,-72 Q-42,-98 -55,-72 Q-22,-80 0,-72Z"/>
      <path d="M0,-72 Q38,-102 52,-76 Q22,-82 0,-72Z"/>
      <path d="M0,-72 Q-12,-105 12,-100 Q6,-82 0,-72Z"/>
      <path d="M0,-72 Q-48,-88 -52,-60 Q-24,-68 0,-72Z"/>
    </g>
  </g>

  <!-- Foreground ground strip -->
  <rect y="330" width="1200" height="30" fill="#0E1830" opacity="0.3"/>

  <!-- Ajrak pattern strip -->
  <rect y="360" width="1200" height="40" fill="url(#ajrak)"/>
  <rect y="358" width="1200" height="3" fill="#E4B04A"/>
</svg>
