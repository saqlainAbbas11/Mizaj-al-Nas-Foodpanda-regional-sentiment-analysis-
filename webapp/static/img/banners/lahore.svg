<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="lahoreSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12183A"/>
      <stop offset="25%" stop-color="#1E2A57"/>
      <stop offset="50%" stop-color="#6A2F4E"/>
      <stop offset="75%" stop-color="#B85A38"/>
      <stop offset="100%" stop-color="#E88A3C"/>
    </linearGradient>
    <linearGradient id="lahoreGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2140"/>
      <stop offset="100%" stop-color="#1A1428"/>
    </linearGradient>
    <radialGradient id="lahoreSunset" cx="0.6" cy="0.72" r="0.3">
      <stop offset="0%" stop-color="#E8A04A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A04A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lahoreMosque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9654A"/>
      <stop offset="100%" stop-color="#9A4030"/>
    </linearGradient>
    <linearGradient id="lahoreDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF6"/>
      <stop offset="100%" stop-color="#EDE3D0"/>
    </linearGradient>
    <pattern id="truckArt" width="100" height="40" patternUnits="userSpaceOnUse">
      <rect width="100" height="40" fill="#1B4B43"/>
      <path d="M0,20 Q25,0 50,20 T100,20" stroke="#E8B23A" stroke-width="3" fill="none"/>
      <path d="M0,20 Q25,40 50,20 T100,20" stroke="#C94038" stroke-width="2" fill="none"/>
      <circle cx="25" cy="20" r="7" fill="#D8483E"/><circle cx="25" cy="20" r="3.5" fill="#F4E3B0"/>
      <circle cx="75" cy="20" r="7" fill="#3E7FB0"/><circle cx="75" cy="20" r="3.5" fill="#F4E3B0"/>
      <circle cx="50" cy="8" r="4" fill="#E8B23A"/><circle cx="50" cy="32" r="4" fill="#E8B23A"/>
      <circle cx="50" cy="8" r="1.8" fill="#D8483E"/><circle cx="50" cy="32" r="1.8" fill="#3E7FB0"/>
      <g fill="#E8B23A" opacity="0.5">
        <circle cx="0" cy="0" r="2"/><circle cx="100" cy="0" r="2"/>
        <circle cx="0" cy="40" r="2"/><circle cx="100" cy="40" r="2"/>
      </g>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="300" fill="url(#lahoreSky)"/>
  <rect width="1200" height="300" fill="url(#lahoreSunset)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="60" cy="22" r="1.1" opacity="0.9"/><circle cx="155" cy="48" r="0.7" opacity="0.5"/>
    <circle cx="280" cy="15" r="1" opacity="0.8"/><circle cx="390" cy="38" r="0.8" opacity="0.6"/>
    <circle cx="480" cy="10" r="1.2" opacity="0.7"/><circle cx="590" cy="30" r="0.6" opacity="0.5"/>
    <circle cx="710" cy="18" r="0.9" opacity="0.8"/><circle cx="850" cy="42" r="0.7" opacity="0.5"/>
    <circle cx="980" cy="25" r="1.1" opacity="0.7"/><circle cx="1100" cy="50" r="0.8" opacity="0.6"/>
    <circle cx="120" cy="70" r="0.5" opacity="0.4"/><circle cx="350" cy="62" r="0.6" opacity="0.3"/>
    <circle cx="640" cy="58" r="0.5" opacity="0.3"/><circle cx="1050" cy="68" r="0.5" opacity="0.3"/>
  </g>

  <!-- Crescent + star (Pakistan motif) -->
  <g transform="translate(1080,48)">
    <circle cx="0" cy="0" r="18" fill="#F4E8C8" opacity="0.85"/>
    <circle cx="6" cy="-4" r="15" fill="#1E2A57"/>
    <polygon points="16,-8 18,-2 24,-2 19,2 21,8 16,5 11,8 13,2 8,-2 14,-2" fill="#F4E8C8" opacity="0.8" transform="scale(0.6) translate(12,-5)"/>
  </g>

  <!-- Wispy clouds -->
  <g fill="white" opacity="0.05">
    <ellipse cx="300" cy="90" rx="140" ry="12"/><ellipse cx="360" cy="85" rx="90" ry="8"/>
    <ellipse cx="900" cy="105" rx="120" ry="10"/><ellipse cx="960" cy="100" rx="80" ry="7"/>
  </g>

  <!-- Ground -->
  <rect y="270" width="1200" height="90" fill="url(#lahoreGround)"/>

  <!-- Minar-e-Pakistan (left of center) -->
  <g transform="translate(260,332)">
    <!-- base platform -->
    <polygon points="-50,0 50,0 40,-12 -40,-12" fill="#3A2A50"/>
    <polygon points="-40,-12 40,-12 35,-22 -35,-22" fill="#463862"/>
    <!-- main shaft -->
    <rect x="-12" y="-200" width="24" height="178" fill="#544069"/>
    <!-- shaft detail bands -->
    <rect x="-14" y="-60" width="28" height="4" fill="#6A5580" rx="1"/>
    <rect x="-14" y="-100" width="28" height="4" fill="#6A5580" rx="1"/>
    <rect x="-14" y="-140" width="28" height="4" fill="#6A5580" rx="1"/>
    <!-- lower bulge -->
    <ellipse cx="0" cy="-22" rx="30" ry="10" fill="#463862"/>
    <!-- upper platform -->
    <path d="M-28,-200 Q0,-220 28,-200 Z" fill="#5C4877"/>
    <ellipse cx="0" cy="-200" rx="28" ry="8" fill="#463862"/>
    <!-- upper shaft -->
    <rect x="-5" y="-262" width="10" height="62" fill="#544069"/>
    <!-- crown dome -->
    <path d="M-18,-262 Q0,-285 18,-262 Z" fill="#5C4877"/>
    <!-- finial -->
    <rect x="-2" y="-282" width="4" height="12" fill="#D8B44A"/>
    <circle cx="0" cy="-284" r="4" fill="#E4C05A"/>
  </g>

  <!-- Badshahi Mosque (right of center) — main focus -->
  <g transform="translate(750,332)">
    <!-- courtyard platform -->
    <rect x="-280" y="-40" width="560" height="40" fill="#2E1E3E"/>
    <rect x="-280" y="-45" width="560" height="6" fill="#3A2A4A"/>

    <!-- main facade -->
    <rect x="-230" y="-148" width="460" height="108" fill="url(#lahoreMosque)"/>
    <rect x="-230" y="-148" width="460" height="16" fill="#D87A55"/>
    <!-- facade detail: blind arches -->
    <g fill="#8A3A28" opacity="0.5">
      <path d="M-210,-130 L-210,-80 A20,20 0 0 0 -170,-80 L-170,-130 Z"/>
      <path d="M-155,-130 L-155,-80 A20,20 0 0 0 -115,-80 L-115,-130 Z"/>
      <path d="M115,-130 L115,-80 A20,20 0 0 0 155,-80 L155,-130 Z"/>
      <path d="M170,-130 L170,-80 A20,20 0 0 0 210,-80 L210,-130 Z"/>
    </g>

    <!-- central iwan (great arch) -->
    <path d="M-60,-148 L-60,-90 A60,60 0 0 0 60,-90 L60,-148 Z" fill="#F4EFE6"/>
    <path d="M-50,-148 L-50,-95 A50,50 0 0 0 50,-95 L50,-148 Z" fill="#3A1A15" opacity="0.25"/>
    <!-- iwan decorative frame -->
    <rect x="-64" y="-148" width="128" height="4" fill="#D8B44A" opacity="0.5"/>
    <rect x="-62" y="-148" width="2" height="62" fill="#D8B44A" opacity="0.3"/>
    <rect x="60" y="-148" width="2" height="62" fill="#D8B44A" opacity="0.3"/>

    <!-- four outer minarets -->
    <g fill="#F4EFE6">
      <!-- far left minaret -->
      <rect x="-280" y="-240" width="18" height="140" rx="2"/>
      <path d="M-280,-240 a9,16 0 0 1 18,0 z"/>
      <rect x="-282" y="-245" width="22" height="6" fill="#EDE3D0"/>
      <circle cx="-271" cy="-248" r="3" fill="#E4C05A"/>
      <!-- far right minaret -->
      <rect x="262" y="-240" width="18" height="140" rx="2"/>
      <path d="M262,-240 a9,16 0 0 1 18,0 z"/>
      <rect x="260" y="-245" width="22" height="6" fill="#EDE3D0"/>
      <circle cx="271" cy="-248" r="3" fill="#E4C05A"/>
      <!-- inner left minaret -->
      <rect x="-200" y="-200" width="14" height="100" rx="2"/>
      <path d="M-200,-200 a7,14 0 0 1 14,0 z"/>
      <rect x="-202" y="-204" width="18" height="5" fill="#EDE3D0"/>
      <!-- inner right minaret -->
      <rect x="186" y="-200" width="14" height="100" rx="2"/>
      <path d="M186,-200 a7,14 0 0 1 14,0 z"/>
      <rect x="184" y="-204" width="18" height="5" fill="#EDE3D0"/>
    </g>

    <!-- three marble domes -->
    <g fill="url(#lahoreDome)">
      <!-- left dome -->
      <path d="M-120,-148 a42,42 0 0 1 84,0 z"/>
      <ellipse cx="-78" cy="-148" rx="42" ry="10" fill="#EFE7D6"/>
      <rect x="-80" y="-196" width="4" height="12" fill="#D8B44A"/>
      <!-- central dome (largest) -->
      <path d="M-55,-172 a62,62 0 0 1 110,0 z"/>
      <ellipse cx="0" cy="-172" rx="55" ry="12" fill="#EFE7D6"/>
      <rect x="-3" y="-240" width="6" height="16" fill="#D8B44A"/>
      <circle cx="0" cy="-242" r="5" fill="#E4C05A"/>
      <!-- right dome -->
      <path d="M36,-148 a42,42 0 0 1 84,0 z"/>
      <ellipse cx="78" cy="-148" rx="42" ry="10" fill="#EFE7D6"/>
      <rect x="76" y="-196" width="4" height="12" fill="#D8B44A"/>
    </g>
    <!-- dome ribs (subtle) -->
    <g stroke="#D8CFC0" stroke-width="0.6" opacity="0.3">
      <path d="M0,-234 Q-28,-200 -45,-172"/><path d="M0,-234 Q28,-200 45,-172"/>
      <path d="M0,-234 Q-12,-200 -22,-172"/><path d="M0,-234 Q12,-200 22,-172"/>
    </g>
  </g>

  <!-- City rooftops (left side) -->
  <g fill="#2B2140" opacity="0.85">
    <rect x="30" y="292" width="55" height="20"/><polygon points="30,292 57,275 85,292"/>
    <rect x="100" y="285" width="45" height="27"/><rect x="160" y="290" width="50" height="22"/>
    <rect x="380" y="296" width="40" height="16"/><rect x="430" y="290" width="55" height="22"/>
  </g>
  <!-- City rooftops (right side) -->
  <g fill="#2B2140" opacity="0.85">
    <rect x="1020" y="288" width="50" height="24"/><polygon points="1020,288 1045,272 1070,288"/>
    <rect x="1085" y="282" width="42" height="30"/><rect x="1140" y="290" width="48" height="22"/>
  </g>
  <!-- Window lights -->
  <g fill="#FFD680" opacity="0.45">
    <rect x="42" y="296" width="4" height="4" rx="0.5"/><rect x="56" y="296" width="4" height="4" rx="0.5"/>
    <rect x="110" y="290" width="4" height="4" rx="0.5"/><rect x="125" y="290" width="4" height="4" rx="0.5"/>
    <rect x="170" y="295" width="4" height="4" rx="0.5"/>
    <rect x="440" y="295" width="4" height="4" rx="0.5"/><rect x="460" y="295" width="4" height="4" rx="0.5"/>
    <rect x="1032" y="294" width="4" height="4" rx="0.5"/><rect x="1048" y="294" width="4" height="4" rx="0.5"/>
    <rect x="1095" y="288" width="4" height="4" rx="0.5"/><rect x="1110" y="288" width="4" height="4" rx="0.5"/>
    <rect x="1150" y="296" width="4" height="4" rx="0.5"/>
  </g>

  <!-- Trees/vegetation near mosque -->
  <g fill="#1A3828" opacity="0.8">
    <ellipse cx="480" cy="320" rx="18" ry="22"/><rect x="478" y="320" width="4" height="12" fill="#2A4A35"/>
    <ellipse cx="1040" cy="322" rx="15" ry="18"/><rect x="1038" y="322" width="4" height="10" fill="#2A4A35"/>
  </g>

  <!-- Truck art pattern strip -->
  <rect y="360" width="1200" height="40" fill="url(#truckArt)"/>
  <rect y="358" width="1200" height="3" fill="#E8B23A"/>
</svg>
